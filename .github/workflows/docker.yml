name: Docker

# Builds the image for both platforms, without pushing, whenever something that goes into
# it changes, so a broken Dockerfile shows up in review rather than at release time.
on:
  pull_request:
    paths: [Dockerfile, package.json, package-lock.json, .dockerignore]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false

      - name: Smoke test the amd64 image
        run: |
          docker build -t postgres-mcp:test .
          docker run --rm postgres-mcp:test --help | head -1
