name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every Postgres release still in support.
        postgres: ['14', '15', '16', '17', '18']

    name: test (postgres ${{ matrix.postgres }})

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      # Transaction pooling, as behind Supabase's and Neon's pooled connection strings.
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          LISTEN_PORT: 5432
        ports:
          - 6432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The integration suite is the security evidence — it must actually run here, not
      # silently skip, so the missing-URL case fails the job rather than passing green.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_POOLER_URL: postgres://postgres:postgres@localhost:6432/postgres
