name: Publish

# Tag a release to publish: git tag v0.1.0 && git push --tags
#
# npm: trusted publishing (OIDC), so there is no long-lived npm token to leak. One-time
# setup after the first manual publish: npmjs.com → the package → Settings → Trusted
# publishing → GitHub Actions, repository contextflo/postgres-mcp, workflow publish.yml.
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Never publish a build whose read-only claims have not been demonstrated.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Check the tag matches package.json and server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for version in \
            "$(node -p 'require("./package.json").version')" \
            "$(node -p 'require("./server.json").version')" \
            "$(node -p 'require("./server.json").packages[0].version')"; do
            if [ "$tag" != "$version" ]; then
              echo "Tag $tag does not match version $version in package.json/server.json" >&2
              exit 1
            fi
          done

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

  # Lists the release on the official MCP registry (registry.modelcontextprotocol.io),
  # which clients and directories read from. The io.github.contextflo/ namespace is
  # authorised by this workflow's GitHub OIDC token.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  docker:
    runs-on: ubuntu-latest
    needs: npm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
