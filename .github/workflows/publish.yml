name: Publish

# To release, bump "version" in package.json (and server.json) and merge to main. This runs
# when package.json changes on main and publishes only if that version is not on npm yet, so
# merges that do not bump the version publish nothing.
#
# npm: trusted publishing (OIDC), so there is no long-lived npm token to leak. One-time
# setup after the first manual publish: npmjs.com → the package → Settings → Trusted
# publishing → GitHub Actions, repository contextflo/postgres-mcp, workflow publish.yml.
on:
  push:
    branches: [main]
    paths: [package.json]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Is this version already on npm?
        run: |
          version="$(node -p 'require("./package.json").version')"
          for other in \
            "$(node -p 'require("./server.json").version')" \
            "$(node -p 'require("./server.json").packages[0].version')"; do
            if [ "$other" != "$version" ]; then
              echo "server.json says $other but package.json says $version" >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@contextflo/postgres-mcp@$version" version > /dev/null 2>&1; then
            echo "$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  npm:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write # npm provenance

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Never publish a build whose read-only claims have not been demonstrated.
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

  # Lists the release on the official MCP registry (registry.modelcontextprotocol.io),
  # which clients and directories read from. The io.github.contextflo/ namespace is
  # authorised by this workflow's GitHub OIDC token.
  mcp-registry:
    runs-on: ubuntu-latest
    needs: [check, npm]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  docker:
    runs-on: ubuntu-latest
    needs: [check, npm]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
