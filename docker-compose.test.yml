# Throwaway Postgres for the integration suite.
#
# The role here can write on purpose: the integration tests prove this server stays
# read-only even when handed credentials that are not.
#
#   npm run db:up
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:55432/postgres npm test
#   npm run db:down
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Non-default host port so this never collides with a local Postgres.
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15
